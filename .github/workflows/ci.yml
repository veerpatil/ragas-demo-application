name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync
      - name: Run offline unit tests + quality-gate logic
        env:
          RAG_LLM_PROVIDER: fake
        run: uv run pytest -q
      # The live Ragas evaluation (make test-live) needs an Ollama host and runs
      # on a self-hosted runner or on a schedule, not on every PR.
